<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Paste Enabler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">📋</div>
      <h1>Copy Paste Enabler</h1>
    </div>
    
    <div class="status active">
      <div class="status-dot"></div>
      <span>Active on all websites</span>
    </div>
    
    <div class="features">
      <div class="feature">
        <span class="check">✓</span>
        <span>Copy text enabled</span>
      </div>
      <div class="feature">
        <span class="check">✓</span>
        <span>Paste enabled</span>
      </div>
      <div class="feature">
        <span class="check">✓</span>
        <span>Text selection enabled</span>
      </div>
      <div class="feature">
        <span class="check">✓</span>
        <span>Right-click menu enabled</span>
      </div>
    </div>
    
    <div class="footer">
      <p>Restrictions automatically removed on page load</p>
    </div>
  </div>
</body>
</html>
